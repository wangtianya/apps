name: Deploy download site
on:
  push:
    branches: [main]
    paths: ['**.html', 'assets/**', 'data/**', 'CNAME', '.nojekyll', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare public site only
        run: |
          mkdir _site
          cp index.html 404.html CNAME .nojekyll _site/
          cp -r assets data hiout yaio bookest _site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90192e30d4c1c414ef7e9a1d093d6b5ec7b7 # v4
